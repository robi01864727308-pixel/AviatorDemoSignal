name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            BUILD_GRADLE=$(find . -maxdepth 4 -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
            if [ -z "$BUILD_GRADLE" ]; then
              echo "No Gradle Android project found in repository."
              exit 1
            fi
            GRADLE_DIR=$(dirname "$BUILD_GRADLE")
            cd "$GRADLE_DIR"
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Demo-Signal-APK
          path: "**/*.apk"
